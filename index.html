<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>مواضيع اللغة التركية - الصف التاسع | الأستاذ شادي رحال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #533483);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            color: #fff;
            font-size: 18px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .page {
            display: block;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 2.5rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #f39c12);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.8rem;
        }

        .header h1 i {
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            color: #f39c12;
            margin-left: 10px;
        }

        .header .sub {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
        }

        .developer {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.4rem 1.5rem;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50px;
            font-size: 0.95rem;
        }

        .developer span {
            color: #f39c12;
            font-weight: bold;
        }

        .section {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            padding-right: 1rem;
            border-right: 6px solid #f39c12;
            display: inline-block;
        }

        .section-title i {
            margin-left: 12px;
            color: #f39c12;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            animation: fadeInUp 0.6s ease backwards;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(243, 156, 18, 0.5);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            background: linear-gradient(135deg, rgba(243, 156, 18, 0.2), rgba(255, 255, 255, 0.05));
            padding: 1.8rem 1.5rem;
            position: relative;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-header i {
            font-size: 2.3rem;
            position: absolute;
            bottom: -20px;
            left: 20px;
            background: #f39c12;
            color: #1a1a2e;
            padding: 12px;
            border-radius: 50%;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .card-header h3 {
            font-size: 1.4rem;
            margin-right: 65px;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .card-header .topic-number {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-right: 65px;
        }

        .card-body {
            padding: 1.8rem 1.5rem 1rem;
        }

        .card-body p {
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.7;
            font-size: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            padding: 1rem 1.5rem 1.5rem;
            display: flex;
            gap: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 0.5rem;
        }

        .btn-icon {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.8rem;
            border-radius: 16px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #fff;
            font-weight: 500;
        }

        .btn-icon i {
            font-size: 1.1rem;
        }

        .btn-icon:hover {
            background: #f39c12;
            border-color: #f39c12;
            transform: scale(1.03);
            color: #1a1a2e;
        }

        .modal-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            overflow-y: auto;
        }

        .modal-page.active {
            display: block;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            padding: 2.5rem 2rem;
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
        }

        .close-modal {
            position: fixed;
            top: 25px;
            right: 25px;
            background: #e74c3c;
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.6rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s;
            z-index: 2001;
            border: none;
        }

        .close-modal:hover {
            transform: rotate(90deg);
            background: #c0392b;
        }

        .modal-title {
            font-size: 2rem;
            color: #f39c12;
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 4px solid #f39c12;
            display: inline-block;
        }

        .modal-text {
            line-height: 2;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.92);
            margin: 2rem 0;
            white-space: pre-wrap;
            word-break: break-word;
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-actions {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
            justify-content: center;
        }

        .btn-share {
            min-width: 200px;
            padding: 1rem 2rem;
            border: none;
            border-radius: 60px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s;
            background: #2980b9;
            color: white;
        }

        .btn-share:hover {
            background: #3498db;
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.4);
        }

        @media (max-width: 600px) {
            body { font-size: 16px; }
            .header h1 { font-size: 1.6rem; }
            .cards-grid { gap: 1.2rem; grid-template-columns: 1fr; }
            .modal-title { font-size: 1.5rem; }
            .modal-text { font-size: 1rem; padding: 1.2rem; }
            .btn-icon { font-size: 0.85rem; }
            .section-title { font-size: 1.5rem; }
            .card-header h3 { font-size: 1.2rem; }
            .btn-share { min-width: 160px; padding: 0.8rem 1.5rem; font-size: 1rem; }
        }
    </style>
</head>
<body>

<div class="page">
    <div class="header">
        <h1><i class="fas fa-book-open"></i> مواضيع اللغة التركية</h1>
        <div class="sub">📖 للصف التاسع - الأستاذ شادي رحال</div>
        <div class="developer">💻 المبرمج و المطور: <span>بهاء الحسين</span></div>
    </div>
    <div class="section">
        <h2 class="section-title"><i class="fas fa-star"></i> المواضيع الأساسية</h2>
        <div class="cards-grid" id="mainTopicsGrid"></div>
    </div>
</div>

<div id="topicModal" class="modal-page">
    <div class="modal-content">
        <button class="close-modal" id="closeModalBtn"><i class="fas fa-times"></i></button>
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-text" id="modalText"></div>
        <div class="modal-actions">
            <button class="btn-share" id="shareBtn"><i class="fas fa-share-alt"></i> مشاركة الموضوع</button>
        </div>
    </div>
</div>

<script>
    const mainTopics = [
        { id: 1, title: "Ülkenizde en meşhur meyve ve sebzeler nelerdir?", content: `Suriye'de çok meyve ve sebze vardır. Toprak iyi, hava güzeldir. Elma, üzüm, kiraz, kayısı ve nar çok vardır. Bu meyveler çok lezzetlidir. Domates, salatalık, patlıcan, kabak ve biber de çok yetişir. İnsanlar bu meyve ve sebzeleri her gün yer. Bu yüzden Suriye'de meyve ve sebze çok önemlidir.` },
        { id: 2, title: "Sen hangi mevsim seversin? Niçin? Bu mevsimde neler yaparsın?", content: `Merhaba benim adım [ضع اسمك]. En sevdiğim mevsim yazdır. Çünkü hava sıcak ve güneşlidir. Yaz mevsimini çok severim. Yazın denize giderim ve yüzerim. Arkadaşlarımla oynarım ve bisiklete binerim. Ailemle gezerim ve tatil yaparım. Dondurma yerim ve soğuk içecekler içerim. Bu yüzden yaz benim için çok güzel ve eğlenceli bir mevsimdir.` },
        { id: 3, title: "Şehrinin hava durumu", content: `Merhaba, benim adım [ضع اسمك هنا]. Ben Afrin'de yaşıyorum. Afrin'de hava genellikle güzeldir. Yazın hava sıcak ve güneşlidir. İnsanlar dışarı çıkar, bahçelerde vakit geçirir ve ağaçlardan meyve toplar. Kışın hava soğuk olur ve bazen yağmur yağar. İnsanlar kalın giysiler giyer ve evde vakit geçirir. İlkbahar ve sonbaharda hava ılık olur. Ağaçlar yeşerir ve çiçekler açar. Bu yüzden Afrin'in havasını çok seviyorum.` },
        { id: 4, title: "Benim şehrimin adı Afrin", content: `Benim şehrimin adı Afrin. Afrin çok güzel ve her zaman yeşil bir şehirdir. Burada kış mevsimi Erzurum gibi çok soğuk geçmez, hava genellikle ılıktır. Şehrimizin her yerinde milyonlarca zeytin ağacı vardır, bu yüzden şehrimin rengi yeşildir. Biz bu mevsimde bahçelerde yürüyüş yaparız ve temiz hava alırız. Eğer Afrin'e gelmek isterseniz, yanınıza hafif bir ceket ve bir şemsiye almanız yeterlidir. Burada lezzetli zeytinleri yemeyi sakın unutmayın.` },
        { id: 5, title: "Hasta Olmamak İçin Neler Yapmalıyız?", content: `Sağlıklı olmak için kendimize iyi bakmalıyız. Öncelikle, her gün taze meyve ve sebze yemeliyiz. Özellikle kışın portakal ve mandalina yemek bizi hastalıklardan korur. Bol bol su içmek vücudumuz için çok önemlidir. Dışarı çıkarken havaya göre giyinmeliyiz. Hava soğuksa kalın kıyafetler giymeli ve atkı takmalıyız. Ayrıca, ellerimizi sık sık sabunla yıkamalıyız. Temizlik bizi mikroplardan uzak tutar. Son olarak, geceleri erken uyumalı ve vücudumuzu dinlendirmeliyiz. Eğer bunlara dikkat edersek hasta olmayız ve kendimizi çok iyi hissederiz.` },
        { id: 6, title: "Kişisel temizliğin için neler yapıyorsun?", content: `Sağlıklı olmak için her gün ellerimi sabunla yıkıyorum ve banyo yapıyorum. Ama bazen dikkat etmiyoruz ve hasta oluyoruz. Mesela, dün çok basketbol oynadım ve terledim. Terliyken hemen soğuk su içtim. Sonra arabaya bindim ve camı açtım. Rüzgar çarptı ve çok üşüdüm. Bu yüzden hasta oldum ve eczaneye gidip ilaç aldım. Artık daha dikkatliyim; terliyken soğuk su içmiyorum ve temizliğime dikkat ediyorum.` },
        { id: 7, title: "Sence sağlığın için en önemli üç şey ne?", content: `Bence en önemli üç şey: temizlik, yemek ve dikkat. Her gün ellerimi yıkıyorum çünkü mikroplardan korkuyorum. Ama geçen gün hata yaptım. Basketbol oynadım ve çok terledim. Terliyken soğuk su içtim ve arabanın camını açtım. Bu yüzden çok üşüdüm ve hasta oldum. Eczaneye gidip ilaç aldım. Artık terliyken soğuk su içmiyorum.` },
        { id: 8, title: "Arkadaşınla eşleş - Nasıl hissediyorsun?", content: `4. a. Arkadaşıma sordum: "Bugün nasıl hissediyorsun?" O, "Bugün çok mutluyum" dedi. Çünkü dün akşam ailesiyle güzel bir film izlemiş. Ama biraz da heyecanlı çünkü yarın okulda basketbol maçı var.\n\n4. b. Ben bugün biraz üzgünüm. Çünkü geçen gün basketbol oynarken çok terledim ve soğuk su içtim. Bu yüzden hasta oldum. Ama aynı zamanda mutluyum. Çünkü babam bana iyileşmem için eczaneden ilaç aldı. Yarın iyileşip tekrar arkadaşlarımla oynamak istiyorum.` },
        { id: 9, title: "Sizin ülkenizde hangi özel günler var?", content: `Benim ülkem Suriye'de çok güzel özel günler vardır. En önemli günler Ramazan Bayramı ve Kurban Bayramı'dır. Ayrıca 17 Nisan Bağımsızlık Günü bizim milli bayramımızdır. Biz bu günlerde çok mutlu oluruz. Bayramlarda birbirimize "Bayramınız mübarek olsun" deriz. Diğer özel günlerde ise "Kutlu olsun" veya "Nice mutlu yıllara" deriz.` },
        { id: 10, title: "Sen ne yapmayı seversin, ne yapmayı sevmezsin?", content: `Ben dışarıda arkadaşlarımla basketbol oynamayı ve kitap okumayı çok severim. Çünkü basketbol oynamak beni çok mutlu ve enerjik hissettirir. Ama balık tutmayı sevmem çünkü çok sıkıcıdır. Ayrıca, terliyken soğuk su içmeyi ve araba camını açmayı hiç sevmem. Çünkü geçen gün bu yüzden hasta oldum. Hasta olduğum zaman kendimi çok üzgün hissediyorum. Sağlıklı kalmak için artık çok dikkatliyim.` }
    ];

    let currentTopic = null;

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function renderCards() {
        const grid = document.getElementById('mainTopicsGrid');
        if (!grid) return;
        grid.innerHTML = '';
        mainTopics.forEach((topic, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.animationDelay = `${index * 0.05}s`;
            card.setAttribute('data-id', topic.id);
            let shortContent = topic.content.substring(0, 120) + (topic.content.length > 120 ? '...' : '');
            card.innerHTML = `
                <div class="card-header">
                    <i class="fas fa-scroll"></i>
                    <h3>${escapeHtml(topic.title)}</h3>
                    <div class="topic-number">الموضوع ${topic.id}</div>
                </div>
                <div class="card-body">
                    <p>${escapeHtml(shortContent)}</p>
                </div>
                <div class="card-footer">
                    <button class="btn-icon open-topic" data-id="${topic.id}"><i class="fas fa-eye"></i> قراءة</button>
                    <button class="btn-icon share-topic" data-id="${topic.id}"><i class="fas fa-share-alt"></i> مشاركة</button>
                </div>
            `;
            grid.appendChild(card);
        });
        attachEvents();
    }

    function attachEvents() {
        document.querySelectorAll('.open-topic').forEach(btn => {
            btn.onclick = (e) => {
                e.stopPropagation();
                const id = parseInt(btn.dataset.id);
                openTopic(id);
            };
        });
        document.querySelectorAll('.share-topic').forEach(btn => {
            btn.onclick = (e) => {
                e.stopPropagation();
                const id = parseInt(btn.dataset.id);
                shareTopic(id);
            };
        });
        document.querySelectorAll('.card').forEach(card => {
            card.onclick = (e) => {
                if (e.target.closest('.btn-icon')) return;
                const id = parseInt(card.dataset.id);
                openTopic(id);
            };
        });
    }

    function getTopicById(id) {
        return mainTopics.find(t => t.id === id);
    }

    function openTopic(id) {
        const topic = getTopicById(id);
        if (!topic) return;
        currentTopic = topic;
        document.getElementById('modalTitle').textContent = topic.title;
        document.getElementById('modalText').textContent = topic.content;
        document.getElementById('topicModal').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    async function shareTopic(id) {
        const topic = getTopicById(id);
        if (!topic) return;
        const text = `${topic.title}\n\n${topic.content}`;
        if (navigator.share) {
            try { await navigator.share({ title: topic.title, text: text }); } catch(e) {}
        } else {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            alert(`📋 تم نسخ "${topic.title}" إلى الحافظة`);
        }
    }

    document.getElementById('closeModalBtn').onclick = () => {
        document.getElementById('topicModal').classList.remove('active');
        document.body.style.overflow = 'auto';
    };
    document.getElementById('topicModal').onclick = (e) => {
        if (e.target === document.getElementById('topicModal')) {
            document.getElementById('topicModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }
    };
    document.getElementById('shareBtn').onclick = () => { if (currentTopic) shareTopic(currentTopic.id); };

    renderCards();
</script>
</body>
</html>
